<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#071b3f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ページが見つかりません — Aggy</title>
    <style>
      :root {
        color: #14213d;
        background: #f7f8fb;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        place-items: center;
      }

      main {
        max-width: 36rem;
        padding: 2rem;
        text-align: center;
      }

      p:first-child {
        margin: 0;
        color: #315ee7;
        font-size: 4rem;
        font-weight: 800;
        line-height: 1;
      }

      h1 {
        margin: 1rem 0 0;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
      }

      p {
        line-height: 1.7;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
        margin-top: 2rem;
      }

      a {
        border-radius: 999px;
        padding: 0.75rem 1.25rem;
        color: white;
        background: #315ee7;
        font-weight: 700;
        text-decoration: none;
      }

      a:last-child {
        border: 1px solid #315ee7;
        color: #315ee7;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <main>
      <p aria-hidden="true">404</p>
      <h1>ページが見つかりません</h1>
      <p>URLが変更されたか、ページが削除された可能性があります。</p>
      <nav aria-label="移動先">
        <a href="/">Aggyトップへ</a>
        <a href="/app/">集計を始める</a>
      </nav>
    </main>
  </body>
</html>
